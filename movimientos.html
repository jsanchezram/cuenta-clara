<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tus gastos e ingresos del período, con filtro por categoría y total.">
  <title>Movimientos · CuentaClara</title>
  <!-- Tema guardado, antes de pintar: así no se ve un instante el tema equivocado -->
  <script src="js/api/theme-boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <!-- Barra de marca: queda fija arriba en toda la página; al hacer scroll muestra el título de la vista -->
  <header class="brand-bar">
    <div class="container brand-bar__inner">
      <a class="brand" href="movimientos.html"><span class="brand__mark" aria-hidden="true">C</span>CuentaClara</a>
      <p class="brand-bar__title" aria-hidden="true"></p>
    </div>
  </header>

  <main id="contenido">
    <!-- Encabezado de la vista: la fecha de hoy y el título; al hacer scroll, el título pasa en pequeño a la barra de marca -->
    <div class="page-header">
      <div class="container page-header__body">
        <p class="page-header__eyebrow" data-today>&nbsp;</p>
        <h1 class="page-header__title">Tus <span class="page-header__accent">movimientos</span></h1>
      </div>
    </div>

    <div class="container page-body stack stack--compact layout">
      <!-- Aviso al volver de editar o eliminar (HU02-7) -->
      <div id="flash" class="notice-slot"></div>

      <!-- Panel: en el celular sus partes van en el flujo y los controles quedan fijos arriba;
           en laptop es una columna fija a la izquierda, con los controles y el resumen -->
      <div class="layout__panel">
        <!-- Período y filtros: quedan fijos al hacer scroll -->
        <div class="sticky-bar">
          <div class="sticky-bar__inner">
            <!-- [HU01-12] Selector de período a todo el ancho: abre la hoja con atajos y calendario -->
            <button class="period-trigger" type="button" id="period-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="period-sheet">
              <!--icon:calendar--><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M8 2a1 1 0 0 1 1 1v1h6V3a1 1 0 1 1 2 0v1h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V3a1 1 0 0 1 1-1zM5 10v9h14v-9zM7 12h3v3H7z"/></svg>
              <span class="period-trigger__text">
                <span class="period-trigger__value" id="period-value">Este mes</span>
                <span class="period-trigger__range" id="period-range">&nbsp;</span>
              </span>
              <!--icon:chevron-down--><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M5.4 8.6 4 10l8 8 8-8-1.4-1.4-6.6 6.6z"/></svg>
            </button>

            <!-- [HU01-3] Filtro por categoría -->
            <div class="chip-group" id="category-chips" role="group" aria-label="Filtrar por categoría"></div>
          </div>
        </div>

        <!-- [HU01-5] Totales de lo filtrado en la tarjeta destacada: el saldo en grande; debajo, ingresos y gastos -->
        <dl class="hero-summary" id="summary" aria-label="Resumen del período">
          <div class="hero-summary__main"><dt class="hero-summary__label">Saldo</dt><dd class="hero-summary__value" id="total-balance">—</dd></div>
          <div class="hero-summary__stat"><dt class="hero-summary__stat-label"><!--icon:arrow-down-left--><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M17 18H6V7h2v7.6l8.3-8.3 1.4 1.4L9.4 16H17z"/></svg>Ingresos</dt><dd class="hero-summary__stat-value" id="total-income">—</dd></div>
          <div class="hero-summary__stat"><dt class="hero-summary__stat-label"><!--icon:arrow-up-right--><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M7 6h11v11h-2V9.4l-8.3 8.3-1.4-1.4L14.6 8H7z"/></svg>Gastos</dt><dd class="hero-summary__stat-value" id="total-expenses">—</dd></div>
        </dl>
      </div>

      <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>

      <section class="stack stack--sm layout__main" aria-labelledby="list-title">
        <h2 class="list-title" id="list-title" tabindex="-1">Movimientos</h2>
        <!-- [HU01-7..9] Lista (con "Cargar más") y estados de carga, vacío y error -->
        <div class="layout__scroll" id="list-region" aria-busy="true"></div>
      </section>

      <!-- [HU01-12] [HU01-13] Hoja sobre la pantalla: atajos, calendario y rango -->
      <dialog class="sheet" id="period-sheet" aria-labelledby="period-sheet-title">
        <div class="sheet__inner">
          <div class="sheet__header">
            <h2 class="sheet__title" id="period-sheet-title">Elige un período</h2>
            <button class="icon-btn" type="button" data-close><!--icon:close--><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg><span class="visually-hidden">Cerrar</span></button>
          </div>
          <div class="option-group" role="group" aria-label="Atajos de período">
            <button class="option" type="button" data-shortcut="TODAY" aria-pressed="false">Hoy</button>
            <button class="option" type="button" data-shortcut="WEEK" aria-pressed="false">Esta semana</button>
            <button class="option" type="button" data-shortcut="MONTH" aria-pressed="false">Este mes</button>
            <button class="option" type="button" data-shortcut="PREV_MONTH" aria-pressed="false">Mes anterior</button>
          </div>
          <form class="stack stack--compact" id="range-form" novalidate aria-label="Rango personalizado">
            <cc-calendario-rango id="range-calendar"></cc-calendario-rango>
            <div class="period-range">
              <div class="field">
                <label class="field__label" for="range-from">Desde</label>
                <input class="field__control" type="date" id="range-from" name="from" aria-describedby="range-from-error">
                <p class="field__error" id="range-from-error"></p>
              </div>
              <div class="field">
                <label class="field__label" for="range-to">Hasta</label>
                <input class="field__control" type="date" id="range-to" name="to" aria-describedby="range-to-error">
                <p class="field__error" id="range-to-error"></p>
              </div>
            </div>
            <div class="sheet__footer">
              <button class="btn btn--secondary" type="button" data-close>Cancelar</button>
              <button class="btn btn--primary" type="submit">Aplicar rango</button>
            </div>
          </form>
        </div>
      </dialog>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Principal">
    <ul class="bottom-nav__list">
      <li><a class="bottom-nav__link" href="movimientos.html" aria-current="page"><!--icon:list--><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M4 5h16v2H4zM4 11h16v2H4zM4 17h16v2H4z"/></svg>Movimientos</a></li>
      <li><a class="bottom-nav__link" href="registrar.html"><!--icon:plus--><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg>Registrar</a></li>
      <li><a class="bottom-nav__link" href="presupuesto.html"><!--icon:pie--><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M11 4a9 9 0 1 0 9 9h-9zM13 2v9h9a9 9 0 0 0-9-9z"/></svg>Presupuesto</a></li>
      <li><a class="bottom-nav__link" href="perfil.html"><!--icon:user--><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M12 3a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM4 20c0-3.87 3.58-6.5 8-6.5s8 2.63 8 6.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>Perfil</a></li>
    </ul>
  </nav>

  <script type="module">
    import { mountTransactions } from './js/screens/movimientos.js';
    mountTransactions();
  </script>
</body>
</html>
