<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tu límite mensual por categoría, cuánto llevas usado y los avisos cuando te acercas o te pasas.">
  <title>Presupuesto · CuentaClara</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="page-header">
    <div class="brand-bar"><div class="container"><a class="brand" href="movimientos.html"><span class="brand__mark" aria-hidden="true">C</span>CuentaClara</a></div></div>
    <div class="container page-header__body">
    <p class="page-header__eyebrow" id="month-eyebrow">&nbsp;</p>
    <h1 class="page-header__title">Tu presupuesto</h1>
    <p class="page-header__lead">Define cuánto quieres gastar en cada categoría y te avisamos antes de que te pases.</p>
    </div>
  </header>

  <main id="contenido" class="container stack">
    <!-- REQ-10 · Navegación de mes -->
    <nav class="month-nav" id="month-nav" aria-label="Cambiar de mes"></nav>

    <!-- REQ-10 · Meses anteriores en solo lectura -->
    <p class="alert" id="readonly-note" hidden>Estás viendo un mes anterior: solo lectura.</p>

    <!-- REQ-04 · Resumen del mes -->
    <p class="card" id="summary"><strong>Resumen:</strong> <span id="summary-text">—</span></p>

    <!-- Anuncios: resumen al cargar y confirmaciones -->
    <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>

    <section class="stack" aria-labelledby="cards-title">
      <h2 class="card__title" id="cards-title" tabindex="-1">Categorías</h2>
      <!-- REQ-02 · REQ-03 · REQ-11 · Tarjetas por urgencia y estados de carga y error -->
      <div class="stack card-grid" id="cards" aria-busy="true"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Principal">
    <ul class="bottom-nav__list">
      <li><a class="bottom-nav__link" href="movimientos.html"><span class="bottom-nav__icon" aria-hidden="true">≡</span>Movimientos</a></li>
      <li><a class="bottom-nav__link" href="registrar.html"><span class="bottom-nav__icon" aria-hidden="true">＋</span>Registrar</a></li>
      <li><a class="bottom-nav__link" href="presupuesto.html" aria-current="page"><span class="bottom-nav__icon" aria-hidden="true">◔</span>Presupuesto</a></li>
    </ul>
  </nav>

  <script type="module">
    import { mountBudget } from './js/screens/presupuesto.js';
    mountBudget();
  </script>
</body>
</html>
